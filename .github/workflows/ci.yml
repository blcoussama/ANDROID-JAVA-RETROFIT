name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, lint et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;35.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v6
      - name: assembleDebug lint testDebugUnitTest
        run: ./gradlew assembleDebug lint testDebugUnitTest

  dependency-audit:
    name: Audit des dépendances (osv-scanner sur app/gradle.lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: osv-scanner
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source -r .

  secrets:
    name: Recherche de secrets (gitleaks, tout l'historique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact
